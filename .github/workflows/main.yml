name: Build Symbiote Evolution

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: gradle build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: SymbioteEvolution
          path: build/libs/*.jar
